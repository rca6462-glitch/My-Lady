<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Will You Be My Valentine? ✨</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;600;700&family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --pastel-pink: #ffd1dc;
            --pastel-lavender: #e6e6fa;
            --pastel-mint: #b5ead7;
            --pastel-yellow: #fffacd;
            --soft-red: #ff6b8b;
            --soft-purple: #c9a0dc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, var(--pastel-pink), var(--pastel-lavender), var(--pastel-mint));
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        /* Animated Background Elements */
        .bubble {
            position: fixed;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            animation: floatUp 15s infinite linear;
            z-index: 0;
        }

        .heart-bg {
            position: fixed;
            font-size: 20px;
            color: rgba(255, 107, 139, 0.3);
            animation: float 8s infinite ease-in-out;
            z-index: 0;
        }

        /* Main Container */
        .container {
            width: 100%;
            max-width: 900px;
            z-index: 10;
            perspective: 1000px;
        }

        /* Kawaii Card */
        .kawaii-card {
            background: rgba(255, 255, 255, 0.92);
            border-radius: 35px;
            padding: 60px 40px;
            box-shadow: 
                0 20px 60px rgba(255, 107, 139, 0.15),
                inset 0 0 0 8px rgba(255, 255, 255, 0.8),
                0 0 0 12px rgba(255, 214, 220, 0.5);
            position: relative;
            overflow: hidden;
            animation: cardAppear 1.2s ease-out;
            backdrop-filter: blur(10px);
            border: 3px solid rgba(255, 255, 255, 0.8);
        }

        .kawaii-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 80%, rgba(255, 209, 220, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(201, 160, 220, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(255, 250, 205, 0.2) 0%, transparent 50%);
            z-index: 0;
        }

        .card-content {
            position: relative;
            z-index: 1;
        }

        /* Header */
        .header {
            margin-bottom: 50px;
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--soft-red), transparent);
            border-radius: 2px;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 5rem;
            background: linear-gradient(45deg, var(--soft-red), var(--soft-purple));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            text-shadow: 3px 3px 0px rgba(255, 255, 255, 0.8);
            position: relative;
            display: inline-block;
        }

        h1::after {
            content: '💖🌸💕';
            position: absolute;
            top: -25px;
            right: -40px;
            font-size: 2.5rem;
            animation: bounce 2s infinite;
        }

        .subtitle {
            font-size: 1.8rem;
            color: var(--soft-purple);
            font-weight: 600;
            letter-spacing: 1px;
        }

        /* Question Section */
        .question-section {
            margin: 60px 0;
            position: relative;
        }

        .question-container {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.9), rgba(255, 250, 205, 0.9));
            border-radius: 30px;
            padding: 40px;
            display: inline-block;
            box-shadow: 
                0 10px 30px rgba(255, 107, 139, 0.1),
                inset 0 0 0 3px rgba(255, 255, 255, 0.8);
            border: 3px dashed var(--soft-red);
            animation: gentlePulse 2s infinite alternate;
        }

        .question {
            font-family: 'Comic Neue', cursive;
            font-size: 4.2rem;
            color: var(--soft-red);
            line-height: 1.2;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0px rgba(255, 255, 255, 0.9);
        }

        .floating-hearts {
            font-size: 3.5rem;
            margin: 25px 0;
            animation: floatHearts 3s infinite ease-in-out;
        }

        /* Kawaii Characters */
        .kawaii-characters {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: 40px 0;
            flex-wrap: wrap;
        }

        .character {
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            animation: wiggle 3s infinite;
            cursor: pointer;
            transition: all 0.3s;
        }

        .character:hover {
            transform: scale(1.3) rotate(10deg);
        }

        /* Buttons */
        .buttons-container {
            display: flex;
            justify-content: center;
            gap: 35px;
            margin-top: 60px;
            flex-wrap: wrap;
        }

        .kawaii-btn {
            padding: 25px 60px;
            font-size: 2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 
                0 15px 35px rgba(0, 0, 0, 0.1),
                inset 0 -4px 10px rgba(0, 0, 0, 0.1),
                0 0 0 3px rgba(255, 255, 255, 0.8);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            gap: 20px;
            min-width: 220px;
            justify-content: center;
        }

        .kawaii-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.7s;
        }

        .kawaii-btn:hover::before {
            left: 100%;
        }

        .yes-btn {
            background: linear-gradient(135deg, #ff6b8b, #ff8fab);
            color: white;
            transform: rotate(-5deg);
        }

        .yes-btn:hover {
            transform: rotate(0deg) scale(1.15);
            box-shadow: 
                0 20px 40px rgba(255, 107, 139, 0.3),
                inset 0 -4px 10px rgba(0, 0, 0, 0.1),
                0 0 0 3px rgba(255, 255, 255, 0.8);
        }

        .no-btn {
            background: linear-gradient(135deg, #a8e6cf, #c9a0dc);
            color: #5a3d5c;
            transform: rotate(5deg);
        }

        .no-btn:hover {
            transform: rotate(0deg) scale(1.15);
            box-shadow: 
                0 20px 40px rgba(169, 160, 220, 0.3),
                inset 0 -4px 10px rgba(0, 0, 0, 0.1),
                0 0 0 3px rgba(255, 255, 255, 0.8);
        }

        /* Quotes Gallery */
        .quotes-gallery {
            display: none;
            margin-top: 50px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 25px;
            border: 3px dotted var(--soft-purple);
        }

        .quotes-gallery.active {
            display: block;
            animation: slideUp 0.8s ease-out;
        }

        .gallery-title {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            color: var(--soft-red);
            margin-bottom: 30px;
            text-align: center;
        }

        .quotes-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        .quote-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.9), rgba(255, 250, 205, 0.9));
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(255, 107, 139, 0.1);
            border: 3px solid rgba(255, 214, 220, 0.8);
            position: relative;
            overflow: hidden;
            transition: all 0.4s;
            cursor: pointer;
        }

        .quote-card:hover {
            transform: translateY(-10px) rotate(2deg);
            box-shadow: 0 20px 40px rgba(255, 107, 139, 0.2);
        }

        .quote-card::before {
            content: '"';
            position: absolute;
            top: -20px;
            left: 10px;
            font-size: 6rem;
            color: rgba(255, 107, 139, 0.1);
            font-family: 'Dancing Script', cursive;
        }

        .quote-text {
            font-size: 1.4rem;
            line-height: 1.6;
            color: #5a3d5c;
            margin-bottom: 20px;
            font-style: italic;
            position: relative;
            z-index: 1;
        }

        .quote-author {
            text-align: right;
            color: var(--soft-purple);
            font-weight: 600;
            font-size: 1.2rem;
        }

        .quote-emoji {
            position: absolute;
            bottom: 15px;
            right: 15px;
            font-size: 2rem;
            opacity: 0.7;
        }

        .quote-nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
        }

        .quote-btn {
            background: var(--soft-red);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5rem;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(255, 107, 139, 0.3);
        }

        .quote-btn:hover {
            transform: scale(1.1);
            background: var(--soft-purple);
        }

        .quote-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .current-quote {
            font-size: 1.2rem;
            color: var(--soft-purple);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Sparkle Effect */
        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 10px 2px white;
            animation: sparkle 1.5s infinite;
            pointer-events: none;
        }

        /* Animations */
        @keyframes cardAppear {
            0% {
                opacity: 0;
                transform: translateY(50px) scale(0.8) rotate(-5deg);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1) rotate(0deg);
            }
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.7;
            }
            90% {
                opacity: 0.7;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-20px) rotate(10deg);
            }
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-15px);
            }
        }

        @keyframes wiggle {
            0%, 100% {
                transform: rotate(0deg);
            }
            25% {
                transform: rotate(-10deg);
            }
            75% {
                transform: rotate(10deg);
            }
        }

        @keyframes gentlePulse {
            0% {
                transform: scale(1);
                box-shadow: 
                    0 10px 30px rgba(255, 107, 139, 0.1),
                    inset 0 0 0 3px rgba(255, 255, 255, 0.8);
            }
            100% {
                transform: scale(1.02);
                box-shadow: 
                    0 15px 40px rgba(255, 107, 139, 0.2),
                    inset 0 0 0 3px rgba(255, 255, 255, 0.9);
            }
        }

        @keyframes floatHearts {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            33% {
                transform: translateY(-15px) rotate(5deg);
            }
            66% {
                transform: translateY(5px) rotate(-5deg);
            }
        }

        @keyframes slideUp {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes sparkle {
            0%, 100% {
                opacity: 0;
                transform: scale(0.5);
            }
            50% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Star Container */
        .star-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% {
                opacity: 0.3;
            }
            50% {
                opacity: 1;
            }
        }

        /* Confetti */
        .confetti {
            position: fixed;
            width: 15px;
            height: 15px;
            opacity: 0;
            animation: confettiFall 3s ease-out forwards;
            z-index: 1000;
            pointer-events: none;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(-100px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 {
                font-size: 3.5rem;
            }
            
            .question {
                font-size: 3rem;
            }
            
            .kawaii-btn {
                padding: 20px 40px;
                font-size: 1.6rem;
                min-width: 180px;
            }
            
            .character {
                width: 80px;
                height: 80px;
                font-size: 3rem;
            }
            
            .kawaii-card {
                padding: 40px 25px;
            }
            
            .quotes-container {
                grid-template-columns: 1fr;
            }
            
            .gallery-title {
                font-size: 2.8rem;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 2.8rem;
            }
            
            .question {
                font-size: 2.3rem;
            }
            
            .kawaii-btn {
                padding: 18px 30px;
                font-size: 1.4rem;
                min-width: 150px;
            }
            
            .buttons-container {
                gap: 20px;
            }
            
            .gallery-title {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>
    <!-- Background Elements -->
    <div class="bubble" id="bubble1"></div>
    <div class="bubble" id="bubble2"></div>
    <div class="bubble" id="bubble3"></div>
    
    <!-- Stars -->
    <div class="star-container" id="starContainer"></div>
    
    <!-- Hearts -->
    <div id="heartContainer"></div>

    <!-- Main Container -->
    <div class="container">
        <div class="kawaii-card">
            <div class="card-content">
                <!-- Header -->
                <div class="header">
                    <h1>✨ My Sweet Valentine ✨</h1>
                    <div class="subtitle">you make my world sparkle ✨💖</div>
                </div>

                <!-- Kawaii Characters -->
                <div class="kawaii-characters">
                    <div class="character" data-emoji="🐱">🐱</div>
                    <div class="character" data-emoji="🌸">🌸</div>
                    <div class="character" data-emoji="🍰">🍰</div>
                    <div class="character" data-emoji="🎀">🎀</div>
                    <div class="character" data-emoji="🌈">🌈</div>
                </div>

                <!-- Question Section -->
                <div class="question-section">
                    <div class="question-container">
                        <div class="question">
                            Will you be my Valentine? 💝
                        </div>
                        <div class="floating-hearts">
                            💕💖💗💓💞💘
                        </div>
                    </div>
                </div>

                <!-- Buttons -->
                <div class="buttons-container">
                    <button class="kawaii-btn yes-btn" id="yesBtn">
                        <i class="fas fa-heart"></i> Yes! Absolutely!
                    </button>
                    <button class="kawaii-btn no-btn" id="noBtn">
                        <i class="fas fa-star"></i> Maybe...?
                    </button>
                </div>

                <!-- Quotes Gallery (Initially Hidden) -->
                <div class="quotes-gallery" id="quotesGallery">
                    <h2 class="gallery-title">Reasons Why I Love You 💕</h2>
                    
                    <div class="quotes-container" id="quotesContainer">
                        <!-- Quotes will be inserted here by JavaScript -->
                    </div>

                    <div class="quote-nav">
                        <button class="quote-btn" id="prevQuoteBtn">
                            <i class="fas fa-chevron-left"></i>
                        </button>
                        <div class="current-quote">
                            <span id="currentQuoteNum">1</span> / <span id="totalQuotes">12</span>
                        </div>
                        <button class="quote-btn" id="nextQuoteBtn">
                            <i class="fas fa-chevron-right"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Romantic quotes database
        const romanticQuotes = [
            {
                text: "Every moment with you feels like a beautiful dream I never want to wake up from.",
                author: "My Heart",
                emoji: "💭✨"
            },
            {
                text: "Your smile is my favorite sight in the world, and your laugh is my favorite sound.",
                author: "Forever Yours",
                emoji: "😊🎶"
            },
            {
                text: "I fall in love with you more every single day, in ways I didn't even know were possible.",
                author: "Always",
                emoji: "💖🌅"
            },
            {
                text: "You're the missing piece I didn't know I was searching for until I found you.",
                author: "My Soulmate",
                emoji: "🧩❤️"
            },
            {
                text: "With you, every ordinary moment becomes an extraordinary memory.",
                author: "Your Partner",
                emoji: "🌟📸"
            },
            {
                text: "Your kindness and compassion inspire me to be a better person every day.",
                author: "Admiring You",
                emoji: "🤗💫"
            },
            {
                text: "I love the person I am when I'm with you - you bring out the best in me.",
                author: "Growing Together",
                emoji: "🌱💕"
            },
            {
                text: "You're my safe haven, my comfort, and my greatest adventure all in one.",
                author: "My Everything",
                emoji: "🏡⚡"
            },
            {
                text: "The way you care about others shows me what a beautiful soul you have.",
                author: "In Awe",
                emoji: "👼🌸"
            },
            {
                text: "Every love song I hear reminds me of you, because you are my favorite melody.",
                author: "Your Music",
                emoji: "🎵💘"
            },
            {
                text: "I promise to cherish you, support you, and love you more each day.",
                author: "My Vow",
                emoji: "🤝💍"
            },
            {
                text: "You're not just my Valentine, you're my today, tomorrow, and forever.",
                author: "Eternally Yours",
                emoji: "⏳❤️"
            }
        ];

        let currentQuoteIndex = 0;
        let sparkleCount = 0;
        let starsCreated = false;

        // Create background elements
        function createBackgroundElements() {
            // Create bubbles
            for (let i = 1; i <= 3; i++) {
                const bubble = document.getElementById(`bubble${i}`);
                const size = Math.random() * 120 + 60;
                bubble.style.width = `${size}px`;
                bubble.style.height = `${size}px`;
                bubble.style.left = `${Math.random() * 100}vw`;
                bubble.style.animationDelay = `${Math.random() * 10}s`;
                bubble.style.background = `rgba(255, 255, 255, ${Math.random() * 0.2 + 0.1})`;
            }

            // Create floating hearts
            const heartContainer = document.getElementById('heartContainer');
            const heartIcons = ['💖', '💕', '💗', '💓', '💞', '💘', '💝', '🌸', '✨'];
            
            for (let i = 0; i < 20; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart-bg';
                heart.innerHTML = heartIcons[Math.floor(Math.random() * heartIcons.length)];
                heart.style.left = `${Math.random() * 100}vw`;
                heart.style.top = `${Math.random() * 100}vh`;
                heart.style.animationDelay = `${Math.random() * 5}s`;
                heart.style.fontSize = `${Math.random() * 25 + 15}px`;
                heartContainer.appendChild(heart);
            }

            // Create stars
            if (!starsCreated) {
                const starContainer = document.getElementById('starContainer');
                for (let i = 0; i < 50; i++) {
                    const star = document.createElement('div');
                    star.className = 'star';
                    star.style.left = `${Math.random() * 100}vw`;
                    star.style.top = `${Math.random() * 100}vh`;
                    star.style.animationDelay = `${Math.random() * 3}s`;
                    star.style.animationDuration = `${Math.random() * 2 + 2}s`;
                    starContainer.appendChild(star);
                }
                starsCreated = true;
            }
        }

        // Create sparkle effect
        function createSparkle(x, y) {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            sparkle.style.left = `${x}px`;
            sparkle.style.top = `${y}px`;
            sparkle.style.animationDelay = `${Math.random() * 0.5}s`;
            document.body.appendChild(sparkle);

            sparkleCount++;
            if (sparkleCount > 50) {
                const sparkles = document.querySelectorAll('.sparkle');
                if (sparkles.length > 50) {
                    sparkles[0].remove();
                }
            }

            setTimeout(() => {
                if (sparkle.parentNode) {
                    sparkle.remove();
                }
            }, 1500);
        }

        // Create confetti celebration
        function createConfetti() {
            const colors = ['#ff6b8b', '#c9a0dc', '#b5ead7', '#fffacd', '#ffd1dc'];
            const shapes = ['circle', 'square', 'triangle'];
            
            for (let i = 0; i < 150; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = `${Math.random() * 100}vw`;
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDelay = `${Math.random() * 2}s`;
                confetti.style.width = `${Math.random() * 15 + 5}px`;
                confetti.style.height = confetti.style.width;
                
                if (Math.random() > 0.5) {
                    confetti.style.borderRadius = '50%';
                } else if (Math.random() > 0.7) {
                    confetti.style.clipPath = 'polygon(50% 0%, 0% 100%, 100% 100%)';
                }
                
                document.body.appendChild(confetti);
                
                setTimeout(() => {
                    if (confetti.parentNode) {
                        confetti.remove();
                    }
                }, 3000);
            }
        }

        // Create quote cards
        function createQuoteCards() {
            const quotesContainer = document.getElementById('quotesContainer');
            quotesContainer.innerHTML = '';

            romanticQuotes.forEach((quote, index) => {
                const quoteCard = document.createElement('div');
                quoteCard.className = 'quote-card';
                quoteCard.style.display = index === 0 ? 'block' : 'none';
                quoteCard.dataset.index = index;
                
                quoteCard.innerHTML = `
                    <p class="quote-text">${quote.text}</p>
                    <div class="quote-author">— ${quote.author}</div>
                    <div class="quote-emoji">${quote.emoji}</div>
                `;
                
                quotesContainer.appendChild(quoteCard);
            });

            // Update quote counter
            document.getElementById('totalQuotes').textContent = romanticQuotes.length;
            document.getElementById('currentQuoteNum').textContent = currentQuoteIndex + 1;
            updateNavButtons();
        }

        // Show specific quote
        function showQuote(index) {
            const quotes = document.querySelectorAll('.quote-card');
            quotes.forEach(quote => {
                quote.style.display = 'none';
            });
            
            if (quotes[index]) {
                quotes[index].style.display = 'block';
                currentQuoteIndex = index;
                
                // Update counter
                document.getElementById('currentQuoteNum').textContent = index + 1;
                updateNavButtons();
                
                // Add sparkle effect
                const rect = quotes[index].getBoundingClientRect();
                for (let i = 0; i < 5; i++) {
                    setTimeout(() => {
                        createSparkle(
                            rect.left + Math.random() * rect.width,
                            rect.top + Math.random() * rect.height
                        );
                    }, i * 100);
                }
            }
        }

        // Update navigation buttons
        function updateNavButtons() {
            document.getElementById('prevQuoteBtn').disabled = currentQuoteIndex === 0;
            document.getElementById('nextQuoteBtn').disabled = currentQuoteIndex === romanticQuotes.length - 1;
        }

        // Character interactions
        function setupCharacterInteractions() {
            const characters = document.querySelectorAll('.character');
            const messages = [
                "You're as cute as this kitten! 🐱",
                "Our love blooms like spring flowers! 🌸",
                "Sweet as cake! 🍰",
                "You're tied up in my heart! 🎀",
                "You bring color to my life! 🌈"
            ];

            characters.forEach((character, index) => {
                character.addEventListener('click', function() {
                    // Add sparkle effect
                    const rect = character.getBoundingClientRect();
                    for (let i = 0; i < 10; i++) {
                        setTimeout(() => {
                            createSparkle(
                                rect.left + Math.random() * rect.width,
                                rect.top + Math.random() * rect.height
                            );
                        }, i * 50);
                    }

                    // Play cute sound
                    playCuteSound();
                });
            });
        }

        // Play cute sound
        function playCuteSound() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            // Create a cute melody
            const frequencies = [523.25, 659.25, 783.99, 659.25]; // C5, E5, G5, E5
            
            oscillator.frequency.setValueAtTime(frequencies[0], audioContext.currentTime);
            oscillator.type = 'sine';
            
            gainNode.gain.setValueAtTime(0, audioContext.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.3, audioContext.currentTime + 0.1);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.5);
        }

        // Yes button click
        document.getElementById('yesBtn').addEventListener('click', function() {
            // Create big celebration
            createConfetti();
            
            // Change question
            const question = document.querySelector('.question');
            question.innerHTML = "Yay! You're my Valentine! 🎉💖";
            question.style.animation = 'none';
            setTimeout(() => {
                question.style.animation = 'gentlePulse 1s infinite alternate';
            }, 10);
            
            // Create heart explosion
            const rect = this.getBoundingClientRect();
            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    createSparkle(
                        rect.left + Math.random() * rect.width,
                        rect.top + Math.random() * rect.height
                    );
                }, i * 30);
            }
            
            // Play happy sound
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            // Happy ascending melody
            oscillator.frequency.setValueAtTime(523.25, audioContext.currentTime); // C5
            oscillator.frequency.exponentialRampToValueAtTime(1046.50, audioContext.currentTime + 0.5); // C6
            oscillator.type = 'triangle';
            
            gainNode.gain.setValueAtTime(0, audioContext.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.3, audioContext.currentTime + 0.1);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.8);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.8);
            
            // Show quotes gallery
            const quotesGallery = document.getElementById('quotesGallery');
            quotesGallery.classList.add('active');
            
            // Create quote cards
            createQuoteCards();
            
            // Scroll to quotes
            setTimeout(() => {
                quotesGallery.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 500);
        });

        // No button click (playful)
        document.getElementById('noBtn').addEventListener('click', function() {
            // Change button text temporarily
            const originalText = this.innerHTML;
            const responses = [
                "Are you sure? 🥺",
                "Pretty please? 🌸",
                "I'll be extra cute! 🐱",
                "Think about it! 💭",
                "Just one chance! 💖"
            ];
            
            const randomResponse = responses[Math.floor(Math.random() * responses.length)];
            this.innerHTML = `<i class="fas fa-star"></i> ${randomResponse}`;
            
            // Create gentle sparkles
            const rect = this.getBoundingClientRect();
            for (let i = 0; i < 8; i++) {
                setTimeout(() => {
                    createSparkle(
                        rect.left + Math.random() * rect.width,
                        rect.top + Math.random() * rect.height
                    );
                }, i * 100);
            }
            
            // Play gentle sound
            playCuteSound();
            
            // Reset button text after 2 seconds
            setTimeout(() => {
                this.innerHTML = originalText;
            }, 2000);
        });

        // Quote navigation
        document.getElementById('nextQuoteBtn').addEventListener('click', function() {
            if (currentQuoteIndex < romanticQuotes.length - 1) {
                showQuote(currentQuoteIndex + 1);
            }
        });

        document.getElementById('prevQuoteBtn').addEventListener('click', function() {
            if (currentQuoteIndex > 0) {
                showQuote(currentQuoteIndex - 1);
            }
        });

        // Keyboard navigation for quotes
        document.addEventListener('keydown', function(e) {
            const quotesGallery = document.getElementById('quotesGallery');
            if (quotesGallery.classList.contains('active')) {
                if (e.key === 'ArrowRight' && currentQuoteIndex < romanticQuotes.length - 1) {
                    showQuote(currentQuoteIndex + 1);
                } else if (e.key === 'ArrowLeft' && currentQuoteIndex > 0) {
                    showQuote(currentQuoteIndex - 1);
                }
            }
        });

        // Click quote cards to advance
        document.addEventListener('click', function(e) {
            const quoteCard = e.target.closest('.quote-card');
            if (quoteCard && document.getElementById('quotesGallery').classList.contains('active')) {
                const index = parseInt(quoteCard.dataset.index);
                if (index < romanticQuotes.length - 1) {
                    showQuote(index + 1);
                }
            }
        });

        // Add sparkle effect on mouse move
        document.addEventListener('mousemove', function(e) {
            if (Math.random() > 0.7) {
                createSparkle(e.clientX, e.clientY);
            }
        });

        // Initialize everything
        document.addEventListener('DOMContentLoaded', function() {
            createBackgroundElements();
            setupCharacterInteractions();
            
            // Create random sparkles
            setInterval(() => {
                if (Math.random() > 0.5) {
                    createSparkle(
                        Math.random() * window.innerWidth,
                        Math.random() * window.innerHeight
                    );
                }
            }, 300);
        });

        // Make the card gently follow mouse
        document.addEventListener('mousemove', function(e) {
            const card = document.querySelector('.kawaii-card');
            const x = (window.innerWidth / 2 - e.clientX) / 50;
            const y = (window.innerHeight / 2 - e.clientY) / 50;
            
            card.style.transform = `perspective(1000px) rotateY(${x}deg) rotateX(${y}deg)`;
        });
    </script>
</body>
</html>
